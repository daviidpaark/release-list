name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Spicetify App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: node -c release-list/index.js

      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('release-list/manifest.json', 'utf8'))"
